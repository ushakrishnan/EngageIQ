name: Frontend secret and build checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check-frontend-secrets:
    name: Check frontend for accidental secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps (frontend)
        working-directory: frontend
        run: npm ci

      - name: Run frontend secret checker
        working-directory: frontend
        run: npm run check:frontend-secrets

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: check-frontend-secrets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
